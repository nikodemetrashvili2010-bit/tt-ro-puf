# Tiny Tapeout project information
# Schema matches the ttsky-verilog-template (SKY shuttle), yaml_version 6.
project:
  title:        "Two-arm ring-oscillator PUF"
  author:       "Nikoloz Demetrashvili"
  discord:      ""
  description:  "Ring-oscillator PUF with an automated-layout arm and a hand-hardened arm, to measure layout-induced bias in hardware-security entropy."
  language:     "Verilog"
  clock_hz:     50000000        # measurement reference clock; tunable

  # One tile is about 167x108 uM.
  tiles: "1x1"

  # Unique top module name (includes GitHub username), required by TinyTapeout.
  top_module:  "tt_um_nikodemetrashvili20_ro_puf"

  # Synthesisable sources only. The real oscillator (ro_macro.v) is included;
  # the simulation-only models (ro_macro_sim.v, ro_behavioural.v) are not.
  # Tiny Tapeout expects these files in ./src.
  source_files:
    - "ro_macro.v"
    - "ro_puf_core.v"
    - "ro_puf.v"
    - "tt_um_ro_puf.v"

# Pinout. Descriptive names only; do not add or remove pins.
pinout:
  # Inputs
  ui[0]: "start (rising edge runs one measurement)"
  ui[1]: "arm select (0=A automated, 1=B hardened)"
  ui[2]: "ro_idx[0]"
  ui[3]: "ro_idx[1]"
  ui[4]: "ro_idx[2]"
  ui[5]: "ro_idx[3]"
  ui[6]: "count byte select (0=low, 1=high)"
  ui[7]: ""

  # Outputs
  uo[0]: "count byte bit 0"
  uo[1]: "count byte bit 1"
  uo[2]: "count byte bit 2"
  uo[3]: "count byte bit 3"
  uo[4]: "count byte bit 4"
  uo[5]: "count byte bit 5"
  uo[6]: "count byte bit 6"
  uo[7]: "count byte bit 7"

  # Bidirectional pins
  uio[0]: "done (output, high when count valid)"
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
