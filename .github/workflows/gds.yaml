name: gds

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  archived-evidence:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: install iverilog
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends iverilog
          iverilog -V | head -1

      - name: Check Python and archived numerical evidence
        run: |
          python3 -m compileall -q sim extraction chip
          python3 sim/ref_model.py
          python3 sim/montecarlo.py
          python3 sim/h3_audit.py
          python3 sim/repo_paths.py
          python3 sim/verify_datasheet.py
          python3 sim/verify_macro_provenance.py
          python3 sim/spice/gono/verify.py
          python3 sim/spice/gono/verify_macro.py
          python3 sim/spice/gono/verify_dualarm.py
          python3 sim/spice/gono/verify_provenance.py
          python3 sim/spice/gono/verify_ring_topology.py
          python3 sim/spice/gono/verify_build_bundle.py
          python3 sim/spice/gono/verify_noise.py
          python3 sim/spice/gono/sensitivity.py
          python3 sim/spice/gono/compensation.py
          python3 sim/spice/gono/predictable_bits.py
          python3 sim/spice/gono/compensated_bits.py
          python3 sim/spice/gono/build_transfer.py --selftest
          python3 sim/spice/gono/build_transfer.py
          python3 sim/spice/gono/matched_arm.py --selftest
          python3 sim/spice/gono/matched_arm.py
          python3 sim/spice/gono/pairing_policy.py --selftest
          python3 sim/spice/gono/pairing_policy.py
          python3 sim/spice/gono/verify_predictability.py
          python3 sim/spice/gono/numerical_audit.py
          python3 sim/spice/gono/analyze_noise.py --selftest
          python3 sim/spice/gono/analyze_mux_sweep.py --selftest
          python3 sim/spice/gono/analyze_boundary_sweep.py --selftest
          python3 sim/spice/gono/analyze_instance.py --selftest
          python3 sim/spice/gono/test_instance_corners.py
          python3 sim/spice/gono/analyze_supply.py --selftest
          python3 sim/spice/gono/triage_warnings.py --selftest
          python3 sim/spice/gono/gen_macro_rc_deck.py --selftest
          python3 sim/spice/gono/gen_macro_rc_deck.py --report
          python3 sim/spice/gono/analyze_macro_rc.py --selftest
          python3 sim/spice/gono/analyze_macro_rc.py
          python3 sim/spice/gono/reduce_raw.py --selftest
          python3 sim/spice/gono/verify_mux_archive.py --selftest
          python3 sim/spice/gono/verify_mux_archive.py
          python3 sim/spice/gono/analyze_mux_sweep.py sim/spice/gono/mux --csv /tmp/mux_check.csv
          diff /tmp/mux_check.csv sim/spice/gono/mux_validation.csv
          python3 sim/spice/gono/verify_instance.py
          python3 sim/spice/gono/verify_instance_corners.py --selftest
          python3 sim/spice/gono/verify_instance_corners.py
          python3 sim/spice/gono/triage_warnings.py --build dualarm/build_current --all-builds .
          python3 sim/spice/gono/triage_warnings.py --build dualarm/control_wokwi
          python3 sim/spice/gono/analyze_supply.py --dir sim/spice/gono/supply
          python3 sim/spice/gono/analyze_noise.py
          python3 sim/spice/mc/analyze_mc.py sim/spice/mc/mc_out.txt
          python3 extraction/fetch_inputs.py --selftest
          python3 extraction/verify_inputs.py --selftest
          python3 extraction/ring_census.py --selftest
          python3 extraction/gds_census.py --selftest
          python3 extraction/check_tolerances.py --selftest
          python3 extraction/check_tolerances.py --freeze-check
          python3 extraction/spef_census.py --selftest
          python3 extraction/spef_census.py --verify-archive
          python3 extraction/cell_library.py --selftest
          python3 extraction/cell_library.py --verify-archive
          python3 extraction/ring_topology.py --selftest
          python3 extraction/ring_topology.py --verify-archive
          python3 extraction/verify_inputs.py
          python3 chip/ci_failure_report.py --selftest
          python3 chip/hash_stability.py --selftest
          python3 chip/hash_stability.py
          python3 chip/tile_budget.py --selftest
          python3 chip/tile_budget.py --json /tmp/tile_budget.json
          diff /tmp/tile_budget.json chip/TILE_BUDGET.json
          python3 chip/armc_cost.py --selftest
          python3 chip/armc_cost.py --json /tmp/armc_cost.json
          diff /tmp/armc_cost.json chip/ARMC_COST.json
          python3 chip/g2_decision.py --selftest
          python3 chip/g2_decision.py --freeze-check
          python3 chip/g2_decision.py --json /tmp/g2_decision.json
          diff /tmp/g2_decision.json chip/G2_DECISION.json
          python3 chip/observability_spec.py --selftest
          python3 chip/observability_spec.py --json /tmp/obs.json --csv /tmp/e2.csv
          diff /tmp/obs.json chip/OBSERVABILITY.json
          diff /tmp/e2.csv chip/e2_acceptance.csv
          python3 chip/archive_baseline.py --selftest
          python3 chip/archive_baseline.py --manifest /tmp/frozen_manifest.txt
          diff /tmp/frozen_manifest.txt dualarm/build_2arm_frozen/MANIFEST.txt
          python3 chip/archive_baseline.py
          python3 chip/gen_armc.py --selftest
          python3 chip/gen_armc.py --json /tmp/armc_regions.json --emit /tmp/armc
          diff /tmp/armc_regions.json chip/ARMC_REGIONS.json
          diff /tmp/armc/armc_place.tcl chip/armc_place.tcl
          diff /tmp/armc/ro_armc.v chip/ro_armc.v
          python3 chip/gen_placement_cfg.py --selftest
          python3 chip/gen_placement_cfg.py --json /tmp/placement_cfg.json --emit /tmp/pl
          diff /tmp/placement_cfg.json chip/PLACEMENT_CFG.json
          diff /tmp/pl/placement.cfg chip/placement.cfg
          python3 chip/placement_fidelity.py --selftest
          python3 chip/placement_fidelity.py --strict --def dualarm/build_current/tt_um_nikodemetrashvili20_ro_puf.def
          diff chip/placement.cfg dualarm/src/placement.cfg
          python3 chip/gen_e2_rtl.py --selftest
          python3 chip/gen_e2_rtl.py --emit /tmp/e2 --csv /tmp/e2/plan.csv
          diff /tmp/e2/e2_ro_puf_core.v chip/e2_ro_puf_core.v
          diff /tmp/e2/e2_ro_puf.v chip/e2_ro_puf.v
          diff /tmp/e2/e2_tt_um_ro_puf.v chip/e2_tt_um_ro_puf.v
          diff /tmp/e2/plan.csv chip/e2_tb_plan.csv
          diff chip/e2_ro_puf_core.v dualarm/src/ro_puf_core.v
          diff chip/e2_ro_puf.v dualarm/src/ro_puf.v
          diff chip/e2_tt_um_ro_puf.v dualarm/src/tt_um_ro_puf.v
          diff chip/ro_armc.v dualarm/src/ro_armc.v
          diff -r src dualarm/src
          python3 chip/preregister.py --selftest
          python3 chip/preregister.py --freeze-check
          python3 chip/preregister.py
          python3 chip/verify_phaseE.py --selftest
          python3 chip/verify_phaseE.py
          python3 chip/g3_runbook.py --selftest
          python3 chip/g3_runbook.py --json /tmp/g3.json
          diff /tmp/g3.json chip/G3_RUNBOOK_CHECK.json
          python3 chip/lint_rtl.py --selftest
          python3 chip/lint_rtl.py --json /tmp/rtl_lint.json
          diff /tmp/rtl_lint.json chip/RTL_LINT.json
          python3 chip/release_manifest.py --selftest
          python3 chip/release_manifest.py --json /tmp/release.json
          diff /tmp/release.json chip/RELEASE_MANIFEST.json

  gds:
    needs: archived-evidence
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttsky26c
        with:
          pdk: sky130A

      # Run 72 failed here and the reason was unreadable: the job log wants
      # a signed-in session and the GDS_logs artifact wants an API token.
      # Annotations are the one thing a signed-out reader can see, so the
      # flow's own account of the failure goes into one. This step never
      # fails the job; it is only here to explain a job that already has.
      - name: Why the build failed
        if: failure()
        run: python3 chip/ci_failure_report.py --run-dir runs/wokwi --annotate

      # Since 8 September the 512 Arm A cells go in at step 33 as PLACED,
      # because FIRM at step 17 stops OpenROAD cutting their rows (run 74,
      # docs/phaseG_run74.md). PLACED means detailed placement may move
      # them and the flow only says so in a log nobody can read from here.
      # So on a build that finished, read the DEF it wrote and put the
      # answer in an annotation. Never fails the job: a moved cell is a
      # result, and the gate-level test and precheck behind this job are
      # worth having either way.
      - name: Did Arm A stay where it was put
        if: success()
        run: python3 chip/placement_fidelity.py --def "runs/wokwi/final/def/*.def" --annotate

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttsky26c

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    # In gate-level simulation an Arm A ring is a zero-delay feedback loop.
    # sky130 gives combinational cells no delay in either model view. test.py
    # keeps Arm A out of these runs for that reason, so this job should finish
    # in minutes now. The limit catches the case where something enables one
    # anyway. Simulated time then stops advancing, so no cocotb timeout can
    # expire, and the job would sit on a runner until GitHub's six-hour
    # default kills it.
    timeout-minutes: 30
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttsky26c

      # This job has exited 2 in about forty seconds on run 65 and again on
      # run 71, two weeks apart, and both times the reason was in a log
      # nobody without an account can open. Make exits 2 when it errors, so
      # the guess is a make error rather than a failing test, and a guess is
      # not worth having. Whatever is here when it next fails goes into an
      # annotation, which is readable signed out.
      - name: Why the GL test failed
        if: failure()
        run: |
          {
            echo "cocotb: $(cocotb-config --version 2>&1 | head -1)"
            echo "makefiles: $(cocotb-config --makefiles 2>&1 | head -1)"
            echo "iverilog: $(iverilog -V 2>&1 | head -1)"
            echo "PDK_ROOT=$PDK_ROOT"
            echo "cells: $(ls $PDK_ROOT/sky130A/libs.ref/sky130_fd_sc_hd/verilog/ 2>&1 | tr '\n' ' ')"
            echo "test dir: $(ls test 2>&1 | tr '\n' ' ')"
            if [ -f test/results.xml ]; then
              echo "results.xml:"
              grep -o 'failure[^>]*' test/results.xml | head -5
            else
              echo "no results.xml, so the tests did not get as far as running"
            fi
            for f in test/sim_build/gl/*.log test/sim_build/gl/*.txt; do
              [ -f "$f" ] && echo "$f:" && tail -20 "$f" || true
            done
          } > /tmp/glfail.txt 2>&1
          cat /tmp/glfail.txt
          python3 - <<'PY'
          import io
          body = io.open("/tmp/glfail.txt", encoding="utf-8",
                         errors="replace").read()[:3000]
          enc = (body.replace("%", "%25").replace("\r", "%0D")
                     .replace("\n", "%0A"))
          print("::error title=gl_test failed, here is what was on the "
                "runner::" + enc)
          PY

  viewer:
    if: github.event_name != 'pull_request'
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttsky26c
