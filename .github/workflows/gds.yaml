name: gds

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  archived-evidence:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check Python and archived numerical evidence
        run: |
          python3 -m compileall -q sim
          python3 sim/ref_model.py
          python3 sim/montecarlo.py
          python3 sim/h3_audit.py
          python3 sim/repo_paths.py
          python3 sim/verify_datasheet.py
          python3 sim/verify_macro_provenance.py
          python3 sim/spice/gono/verify.py
          python3 sim/spice/gono/verify_macro.py
          python3 sim/spice/gono/verify_dualarm.py
          python3 sim/spice/gono/verify_provenance.py
          python3 sim/spice/gono/verify_ring_topology.py
          python3 sim/spice/gono/verify_build_bundle.py
          python3 sim/spice/gono/verify_noise.py
          python3 sim/spice/gono/sensitivity.py
          python3 sim/spice/gono/compensation.py
          python3 sim/spice/gono/predictable_bits.py
          python3 sim/spice/gono/compensated_bits.py
          python3 sim/spice/gono/build_transfer.py --selftest
          python3 sim/spice/gono/build_transfer.py
          python3 sim/spice/gono/matched_arm.py --selftest
          python3 sim/spice/gono/matched_arm.py
          python3 sim/spice/gono/pairing_policy.py --selftest
          python3 sim/spice/gono/pairing_policy.py
          python3 sim/spice/gono/verify_predictability.py
          python3 sim/spice/gono/numerical_audit.py
          python3 sim/spice/gono/analyze_noise.py --selftest
          python3 sim/spice/gono/analyze_mux_sweep.py --selftest
          python3 sim/spice/gono/analyze_boundary_sweep.py --selftest
          python3 sim/spice/gono/analyze_instance.py --selftest
          python3 sim/spice/gono/test_instance_corners.py
          python3 sim/spice/gono/analyze_supply.py --selftest
          python3 sim/spice/gono/triage_warnings.py --selftest
          python3 sim/spice/gono/gen_macro_rc_deck.py --selftest
          python3 sim/spice/gono/gen_macro_rc_deck.py --report
          python3 sim/spice/gono/analyze_macro_rc.py --selftest
          python3 sim/spice/gono/analyze_macro_rc.py
          python3 sim/spice/gono/reduce_raw.py --selftest
          python3 sim/spice/gono/verify_mux_archive.py --selftest
          python3 sim/spice/gono/verify_mux_archive.py
          python3 sim/spice/gono/analyze_mux_sweep.py sim/spice/gono/mux --csv /tmp/mux_check.csv
          diff /tmp/mux_check.csv sim/spice/gono/mux_validation.csv
          python3 sim/spice/gono/verify_instance.py
          python3 sim/spice/gono/verify_instance_corners.py --selftest
          python3 sim/spice/gono/verify_instance_corners.py
          python3 sim/spice/gono/triage_warnings.py --build dualarm/build_current --all-builds .
          python3 sim/spice/gono/triage_warnings.py --build dualarm/control_wokwi
          python3 sim/spice/gono/analyze_supply.py --dir sim/spice/gono/supply
          python3 sim/spice/gono/analyze_noise.py
          python3 sim/spice/mc/analyze_mc.py sim/spice/mc/mc_out.txt

  gds:
    needs: archived-evidence
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttsky26c
        with:
          pdk: sky130A

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttsky26c

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    # In gate-level simulation an Arm A ring is a zero-delay feedback loop.
    # sky130 gives combinational cells no delay in either model view. test.py
    # keeps Arm A out of these runs for that reason, so this job should finish
    # in minutes now. The limit catches the case where something enables one
    # anyway. Simulated time then stops advancing, so no cocotb timeout can
    # expire, and the job would sit on a runner until GitHub's six-hour
    # default kills it.
    timeout-minutes: 30
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttsky26c

  viewer:
    if: github.event_name != 'pull_request'
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttsky26c
