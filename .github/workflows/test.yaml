# Started as the stock test workflow from Tiny Tapeout's project template. That
# file is Apache 2.0 and carries no copyright line of its own, so section 4(c)
# left nothing to keep, but 4(b) asks a modified file to say it was modified.
# Mine: the pull_request trigger, the mirrored-tree diff of src against
# dualarm/src, the firmware analyzer tests, make check, checking the cocotb
# results through cocotb_tools instead of grepping the XML, and the extra
# artifacts. The line above covers those, not the template.

name: test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Verify mirrored production trees
        shell: bash
        run: |
          git diff --no-index --exit-code src dualarm/src
          git diff --no-index --exit-code test dualarm/test

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Run firmware analyzer tests
        run: python -m unittest discover -s firmware -p 'test_*.py' -v

      - name: Run self-checking Verilog tests
        run: make check

      - name: Run cocotb tests
        run: |
          cd test
          make clean
          make
          python -m cocotb_tools.check_results results.xml

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: upload waveform and test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          if-no-files-found: warn
          path: |
            test/tb.fst
            test/tb.vcd
            test/results.xml
            test/output/*
