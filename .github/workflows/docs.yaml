# Started as the stock docs workflow from Tiny Tapeout's project template. That
# file is Apache 2.0 and carries no copyright line of its own, so section 4(c)
# left nothing to keep, but 4(b) asks a modified file to say it was modified.
# Mine: the pull_request trigger, the Python setup, the paper-artifact check,
# and gating Build docs off pull requests. The line above covers those, not the
# template.

name: docs

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify paper artifacts
        shell: bash
        run: |
          # The paper is built locally with docs/build_paper.sh (pandoc plus
          # libreoffice) and the artifacts are committed. CI only checks they
          # are present and non-trivial; it does not rebuild them.
          test -s docs/paper/SILICON_paper.docx
          test -s docs/paper/SILICON_paper.pdf
          wc -c docs/paper/SILICON_paper.docx docs/paper/SILICON_paper.pdf

      - name: Build docs
        if: github.event_name != 'pull_request'
        uses: TinyTapeout/tt-gds-action/docs@ttsky26c
