name: docs

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify paper artifacts
        shell: bash
        run: |
          python -m pip install -r requirements-analysis.txt
          python docs/verify_paper.py
          python docs/build_paper.py --output-dir /tmp/paper
          python docs/verify_paper.py --artifact-dir /tmp/paper

      - name: Build docs
        if: github.event_name != 'pull_request'
        uses: TinyTapeout/tt-gds-action/docs@ttsky26c
