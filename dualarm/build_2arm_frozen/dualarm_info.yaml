# Tiny Tapeout project information - DUAL-ARM (v2, Arm B hardened macros).
# Schema matches the ttsky-verilog-template (SKY shuttle), yaml_version 6.
project:
  title:        "Two-arm ring-oscillator PUF"
  author:       "Nikoloz Demetrashvili"
  discord:      ""
  description:  "Ring-oscillator PUF with automated-layout and matched-macro arms, testing deterministic layout-related frequency bias."
  language:     "Verilog"
  clock_hz:     50000000        # measurement reference clock; tunable

  # 16 hardened 60x40um macros on a 4x4 grid need a 2x2 tile (334.88x225.76).
  tiles: "2x2"

  # Unique top module name (includes GitHub username), required by TinyTapeout.
  top_module:  "tt_um_nikodemetrashvili20_ro_puf"

  # Synthesisable sources only. Arm B's ro_macro_hard is NOT listed here: it
  # enters the build as a blackbox + hardened GDS/LEF via src/config.json
  # (VERILOG_FILES_BLACKBOX + MACROS). The simulation-only models
  # (ro_macro_sim.v, ro_macro_hard_sim.v) are not listed either.
  source_files:
    - "ro_macro.v"
    - "ro_puf_core.v"
    - "ro_puf.v"
    - "tt_um_ro_puf.v"

# Pinout. Descriptive names only; do not add or remove pins.
pinout:
  # Inputs
  ui[0]: "start (hold high for at least 3 clock cycles)"
  ui[1]: "arm select (0=A automated, 1=B hardened)"
  ui[2]: "ro_idx[0]"
  ui[3]: "ro_idx[1]"
  ui[4]: "ro_idx[2]"
  ui[5]: "ro_idx[3]"
  ui[6]: "count byte select (0=low, 1=high)"
  ui[7]: ""

  # Outputs
  uo[0]: "count byte bit 0"
  uo[1]: "count byte bit 1"
  uo[2]: "count byte bit 2"
  uo[3]: "count byte bit 3"
  uo[4]: "count byte bit 4"
  uo[5]: "count byte bit 5"
  uo[6]: "count byte bit 6"
  uo[7]: "count byte bit 7"

  # Bidirectional pins
  uio[0]: "done (output, high when count valid)"
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
