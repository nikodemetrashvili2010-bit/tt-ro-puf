# Tiny Tapeout project information - THREE-ARM (v3, Arm B hardened macros,
# Arm C standard cells under placement equalization).
# Schema matches the ttsky-verilog-template (SKY shuttle), yaml_version 6.
project:
  title:        "Three-arm ring-oscillator PUF"
  author:       "Nikoloz Demetrashvili"
  discord:      ""
  description:  "Ring-oscillator PUF with automated-layout, matched-macro and placement-equalized arms, testing deterministic layout-related frequency bias."
  language:     "Verilog"
  clock_hz:     50000000        # measurement reference clock; tunable

  # 16 hardened 60x40um macros on a 4x4 grid need a 2x2 tile (334.88x225.76).
  tiles: "2x2"

  # Unique top module name (includes GitHub username), required by TinyTapeout.
  top_module:  "tt_um_nikodemetrashvili20_ro_puf"

  # Synthesisable sources only. Arm B's ro_macro_hard is NOT listed here: it
  # enters the build as a blackbox + hardened GDS/LEF via src/config.json
  # (VERILOG_FILES_BLACKBOX + MACROS). The simulation-only models
  # (ro_macro_sim.v, ro_macro_hard_sim.v, ro_armc_sim.v) are not listed
  # either. Arm C is an ordinary source: ro_armc.v is the same ring as
  # ro_macro.v under its own module name, so that armc_place.tcl can bind
  # its sixteen copies to equalized regions.
  source_files:
    - "ro_macro.v"
    - "ro_armc.v"
    - "ro_puf_core.v"
    - "ro_puf.v"
    - "tt_um_ro_puf.v"

# Pinout. Descriptive names only; do not add or remove pins.
pinout:
  # Inputs
  ui[0]: "start (hold high for at least 3 clock cycles)"
  ui[1]: "arm select bit 0"
  ui[2]: "ro_idx[0]"
  ui[3]: "ro_idx[1]"
  ui[4]: "ro_idx[2]"
  ui[5]: "ro_idx[3]"
  ui[6]: "count byte select (0=low, 1=high)"
  ui[7]: "arm select bit 1 (0=A automated, 1=B hardened, 2=C equalized)"

  # Outputs
  uo[0]: "count byte bit 0, or version byte when uio[3] is high"
  uo[1]: "count byte bit 1"
  uo[2]: "count byte bit 2"
  uo[3]: "count byte bit 3"
  uo[4]: "count byte bit 4"
  uo[5]: "count byte bit 5"
  uo[6]: "count byte bit 6"
  uo[7]: "count byte bit 7"

  # Bidirectional pins
  uio[0]: "done (output, high when count valid)"
  uio[1]: "window select bit 0"
  uio[2]: "window select bit 1 (0=256, 1=512, 2=2048, 3=16384 cycles)"
  uio[3]: "read version bytes instead of the count"
  uio[4]: "counter overflowed (output, sticky until reset)"
  uio[5]: "measurement active (output)"
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
